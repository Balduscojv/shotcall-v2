[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
priority=10
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

# Fila, agendador e catch-up rodam como root: no Render o container não tem CAP_KILL, então
# o supervisord (root) não conseguia sinalizar processos de www-data ao desligar.
[program:queue]
directory=/var/www/html
command=php artisan queue:work redis --sleep=3 --tries=1 --timeout=90 --memory=128 --max-time=3600
priority=30
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

# Migrations em paralelo com o servidor (antes ficavam no entrypoint e seguravam o boot). Numa
# migration nova, as primeiras requisições podem chegar antes de ela terminar: alguns segundos.
[program:migrate]
directory=/var/www/html
command=php artisan migrate --force --no-interaction
priority=5
autorestart=false
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

# No Render Free a API dorme e o agendador para junto. Ao acordar, põe em dia (uma vez) os
# jogos que começaram e ainda não têm resultado salvo. Se dormir no meio, retoma no próximo boot.
[program:nba-catchup]
directory=/var/www/html
command=php artisan nba:sync --games --no-interaction
priority=40
autorestart=false
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

# Instância única: no boot nenhuma tarefa está rodando, então as travas de withoutOverlapping no
# Redis sobraram de um container que morreu no meio de uma tarefa. Limpa e começa o agendador.
[program:scheduler]
directory=/var/www/html
command=sh -c "php artisan schedule:clear-cache || true; exec php artisan schedule:work"
priority=30
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
