# Serviços de infraestrutura para desenvolvimento local.
# O Laravel (php artisan serve) e o Next.js (npm run dev) rodam fora do Docker.
name: shotcall

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shotcall
      POSTGRES_USER: shotcall
      POSTGRES_PASSWORD: shotcall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shotcall -d shotcall"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shotcall_test
      POSTGRES_USER: shotcall
      POSTGRES_PASSWORD: shotcall
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
