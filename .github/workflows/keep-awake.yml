# Acorda a API e o site no Render Free no horário de uso, e só a API nos horários de
# sincronização e durante os jogos. A lógica de quando acordar fica em scripts/keep_awake.py.
#
# Horário de uso: variável do repositório HORARIO_USO (Settings > Secrets and variables >
# Actions > Variables), em horas de Brasília, ex.: "18-24" ou "20-2". Vazia, vale 18-24.
name: Keep API awake

on:
  schedule:
    # A cada 10 min: o Render dorme após ~15 min sem requisições.
    # O GitHub pode atrasar execuções agendadas em alguns minutos.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Acordar a API e o site mesmo fora dos horários"
        type: boolean
        default: false

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/keep_awake.py
        env:
          FORCE_PING: ${{ inputs.force }}
          HORARIO_USO: ${{ vars.HORARIO_USO }}
